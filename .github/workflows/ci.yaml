name: Java CI

on:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - cache: maven
          distribution: temurin
          java: 26
          os: windows-latest
          arch: arm64
          runner: windows-11-arm
          arch_distribution: zulu
          expander_leg: windows-latest-26-arm64
      max-parallel: 6
    name: Test JDK ${{ matrix.java }}, ${{ matrix.os }} [${{ matrix.expander_leg
      }}]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - name: Setup Java ${{ matrix.java }} ${{ matrix.arch_distribution || 
        matrix.distribution }}
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6   # v6.0.1
      with:
        cache: ${{ matrix.cache }}
        distribution: ${{ matrix.arch_distribution || matrix.distribution }}
        java-version: ${{ matrix.java }}
        architecture: ${{ matrix.arch }}
    - name: Test with Maven
      run: ./mvnw test --batch-mode --no-transfer-progress --show-version 
        -D"license.skip=true"
